[project]
name = "contract-review-agent"
version = "0.1.0"
description = "合同审查 agent：条款拆解、风险识别与人工确认"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
